<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Take Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
        }
        .container {
            display: flex;
            max-width: 800px;
            margin: auto;
        }
        .sidebar {
            width: 150px;
            padding: 10px;
            border-right: 2px solid #ccc;
        }
        .sidebar button {
            display: block;
            width: 100%;
            margin-bottom: 5px;
            padding: 8px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        .sidebar button:hover {
            background: #0056b3;
        }
        .question-container {
            flex: 1;
            padding: 20px;
        }
        .options label {
            display: block;
            margin: 5px 0;
        }
    </style>

</head>
<body>
<p>Start Time: <span th:text="${startTime}"></span></p>
<p>End Time: <span id ="endTime" th:text="${endTime}"></span></p>
<div class="timer">Time Left: <span id="timeRemaining"></span></div>


<div class="container">

    <div class="sidebar">
        <h3>Questions</h3>
        <button th:each="question, iterStat : ${questions}"
                th:text="${iterStat.index + 1}"
                th:onclick="|showQuestion(${iterStat.index})|">
        </button>
    </div>


    <div class="question-container">
        <form action="/saveUserResponse"  id ="testPage" method="post">
            <input type="hidden" name="testId" th:value="${testId != null ? testId : 0}">
            <input type="hidden" name="userId" th:value="${userId != null ? userId : 0}">


            <div th:each="question, iterStat : ${questions}"
                 th:id="|question-${iterStat.index}|"
                 class="question"
                 th:style="${iterStat.index == 0} ? 'display:block;' : 'display:none;'">

                <h2 th:text="|Question ${iterStat.index + 1}: ${question.description}|"></h2>

                <div class="options">
                    <label>
                        <input type="radio" th:name="|answer-${question.id}|" th:value="${question.option1}" required>
                        <span th:text="${question.option1}"></span>
                    </label>

                    <label>
                        <input type="radio" th:name="|answer-${question.id}|" th:value="${question.option2}">
                        <span th:text="${question.option2}"></span>
                    </label>

                    <label>
                        <input type="radio" th:name="|answer-${question.id}|" th:value="${question.option3}">
                        <span th:text="${question.option3}"></span>
                    </label>

                    <label>
                        <input type="radio" th:name="|answer-${question.id}|" th:value="${question.option4}">
                        <span th:text="${question.option4}"></span>
                    </label>
                </div>
            </div>

            <button type="submit">Submit Test</button>
        </form>

    </div>
</div>
<script>
    var endTimeStr = document.getElementById("endTime").innerText;
    var endTime = new Date(endTimeStr).getTime();
  function updateTimer() {
      var now = new Date().getTime();
      var timeLeft = endTime - now;

      if (timeLeft <= 0) {
          document.getElementById("timeRemaining").innerText = "Time Over!";
          document.getElementById("testPage").submit(); // Auto-submit the form
      } else {
          var minutes = Math.floor(timeLeft / (1000 * 60));
          var seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
          document.getElementById("timeRemaining").innerText = minutes + "m " + seconds + "s";
      }
  }

  setInterval(updateTimer, 1000);

  function showQuestion(index) {
      let questions = document.getElementsByClassName("question");
      for (let i = 0; i < questions.length; i++) {
          questions[i].style.display = "none";
      }
      document.getElementById("question-" + index).style.display = "block";
  }
  var endTimeStr = document.getElementById("endTime").innerText;
  var endTime = new Date(endTimeStr).getTime();


</script>
</body>
</html>
